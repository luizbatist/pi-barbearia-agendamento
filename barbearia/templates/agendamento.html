{% extends 'layout.html' %}

{% block title %}Agendar - Rafa darc{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Novo Agendamento</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="/agendar">
                        <div class="mb-3">
                            <label class="form-label">Serviço</label>
                            <select name="servico" class="form-select" required>
                                <option value="">Selecione um serviço</option>
                                <option value="Corte">Corte</option>
                                <option value="Barba">Barba</option>
                                <option value="Corte e Barba">Corte e Barba</option>
                                <option value="Degradê">Degradê</option>
                                <option value="Pigmentação">Pigmentação</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Data</label>
                            <input type="date" name="data" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Horário</label>
                            <input type="time" name="horario" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Confirmar Agendamento</button>
                        <a href="/dashboard" class="btn btn-outline-secondary w-100 mt-2">Voltar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
