{% extends 'layout.html' %}

{% block title %}Cadastro - Rafa darc{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-header bg-dark text-white text-center">
                    <h4 class="mb-0">Criar uma conta</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="/cadastro">
                        <div class="mb-3">
                            <label class="form-label">Nome</label>
                            <input type="text" name="nome" class="form-control" placeholder="Seu nome completo" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <input type="password" name="senha" class="form-control" placeholder="Mínimo 6 caracteres" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Cadastrar</button>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <small>Já tem conta? <a href="/login">Faça login</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
